syntax = "proto3";

package aetheros.protocol.v1;

message Envelope {
  string message_id = 1;
  string device_id = 2;
  int64 timestamp_unix_ms = 3;
  string channel = 4;
  bytes payload = 5;
}

message DeviceHeartbeat {
  string device_id = 1;
  string model = 2;
  int32 battery_percent = 3;
  bool charging = 4;
}
